name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: echo "Add your real setup (uv, python, etc.)"
      - name: Lint
        run: echo "uv run ruff check ."
      - name: Test
        run: echo "uv run pytest"
